[package]
name = "disk-steward-desktop"
version = "0.0.4"
description = "Disk Steward desktop application"
authors = ["Disk Steward"]
edition = "2021"

[lib]
name = "disk_steward_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disk-steward-core = { path = "../crates/disk-steward-core" }
disk-steward-review-plan = { path = "../crates/review-plan" }
disk-steward-demo-execution = { path = "../crates/demo-execution" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

# Keep native development artifacts bounded; application line tables remain.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
