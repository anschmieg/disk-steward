[package]
name = "disk-steward-git-https-worker-probe"
version = "0.0.4"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace]

[dependencies]
gix = { version = "=0.81.0", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "sha1"] }
gix-transport = { version = "=0.55.1", default-features = false, features = ["blocking-client", "http-client-reqwest-rust-tls"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
zeroize = "=1.9.1"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

