[package]
name = "github-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gix-transport = { version = "=0.60.0", default-features = false, features = ["blocking-client", "http-client"] }
gix-error = "=0.4.0"
gix-url = "=0.39.0"
gix-validate = "=0.12.0"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.9"

[dev-dependencies]
verification-budget = { path = "../verification-budget" }
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
