name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: python3 evaluation/harness.py --score-baseline --check-validator
      - run: python3 -m unittest discover -s evaluation -p 'test_*.py'
      - run: python3 -m unittest discover -s probes -p 'test_*.py'
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked -j 2
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked -j 2
      - name: Compile native feasibility helpers without performing cleanup
        run: |
          swiftc probes/native/RecoveryProbe.swift -o "$RUNNER_TEMP/recovery-probe"
          swiftc probes/keychain/KeychainProbe.swift -o "$RUNNER_TEMP/keychain-probe"
          swiftc probes/bookmark/BookmarkProbe.swift -o "$RUNNER_TEMP/bookmark-probe"
          swiftc probes/confirmation/ConfirmationProbe.swift -o "$RUNNER_TEMP/confirmation-probe"
          "$RUNNER_TEMP/keychain-probe"
          "$RUNNER_TEMP/confirmation-probe"
