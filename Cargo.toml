[workspace]
members = ["crates/disk-steward-core", "crates/verification-budget", "crates/approval-ledger", "crates/review-plan", "crates/fixture-lifecycle", "crates/demo-execution", "crates/plan-model", "crates/plan-store", "probes/git-transport", "probes/atomic-rename"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.5"
edition = "2021"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
